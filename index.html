<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Main Stage — Rockstar Moments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --stage-black: #0B0B0F;
    --charcoal: #16161D;
    --smoke: #23232E;
    --cream: #F2ECD9;
    --cream-dim: #E7DFC6;
    --gold: #E8A93B;
    --gold-bright: #F4C463;
    --spot: #FF3D7F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--charcoal);
    background-image:
      /* spotlight thrown in from the top-left corner */
      linear-gradient(154deg, rgba(244,196,99,0.20) 0%, rgba(232,169,59,0.07) 22%, transparent 48%),
      /* spotlight thrown in from the top-right corner */
      linear-gradient(206deg, rgba(232,169,59,0.16) 0%, rgba(232,169,59,0.05) 22%, transparent 48%),
      /* charcoal base fading to stage black at the floor */
      linear-gradient(180deg, var(--charcoal) 0%, var(--stage-black) 78%);
    background-attachment: fixed;
    font-family: 'Barlow', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--cream);
    padding: 0 0 60px;
  }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  .hero {
    text-align: center;
    padding: 44px 20px 30px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-conic-gradient(from 0deg, rgba(244,196,99,0.05) 0deg 6deg, transparent 6deg 12deg);
    mask-image: radial-gradient(circle at 50% 20%, black, transparent 70%);
    pointer-events: none;
  }
  .eyebrow-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    letter-spacing: 3px;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--gold-bright);
    background: rgba(255,61,127,0.10);
    border: 1px solid var(--spot);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
    position: relative;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--spot);
    box-shadow: 0 0 8px var(--spot);
    animation: livePulse 1.8s ease-in-out infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  h1.title {
    font-family: 'Anton', 'Barlow Condensed', sans-serif;
    font-weight: 400;
    font-size: clamp(48px, 9vw, 84px);
    line-height: 0.95;
    margin: 0;
    letter-spacing: 1px;
    color: var(--cream);
    text-shadow: 0 3px 0 rgba(0,0,0,0.55);
    position: relative;
  }
  h1.title .gold { color: var(--gold-bright); }
  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 14px;
    color: var(--cream-dim);
    margin-top: 10px;
    position: relative;
  }

  .cta-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 22px;
    flex-wrap: wrap;
    position: relative;
  }
  .btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    padding: 12px 26px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 120ms ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; }
  .btn-primary { background: var(--gold); color: var(--stage-black); }
  .btn-primary:hover { background: var(--gold-bright); }
  .btn-ghost { background: transparent; color: var(--cream); border-color: rgba(242,236,217,0.4); }
  .btn-ghost:hover { border-color: var(--cream); }
  .btn:disabled { opacity: 0.55; cursor: default; transform: none; }

  .entry-panel {
    background: var(--charcoal);
    border: 1px solid rgba(242,236,217,0.15);
    border-left: 3px solid var(--spot);
    border-radius: 8px;
    padding: 20px 22px;
    margin-top: 26px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  .entry-panel[hidden] { display: none; }
  .entry-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .entry-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .entry-field label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(242,236,217,0.75);
  }
  .entry-field .req { color: var(--spot); }
  .entry-field .opt {
    color: rgba(242,236,217,0.4);
    text-transform: none;
    letter-spacing: 0.5px;
  }
  .entry-field input,
  .entry-field textarea {
    background: rgba(242,236,217,0.05);
    border: 1px solid rgba(242,236,217,0.18);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--cream);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 140ms ease;
    width: 100%;
  }
  .entry-field textarea { resize: vertical; line-height: 1.5; }
  .entry-field input:focus, .entry-field textarea:focus { border-color: var(--gold); }
  .entry-field input::placeholder,
  .entry-field textarea::placeholder { color: rgba(242,236,217,0.35); }

  .entry-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .entry-status {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: rgba(242,236,217,0.6);
  }
  .entry-status.ok { color: var(--gold-bright); }
  .entry-status.warn { color: var(--spot); }
  .entry-status.err { color: #FF9C9C; }
  .entry-fallback {
    margin-top: 14px;
    font-size: 12.5px;
    color: rgba(242,236,217,0.45);
  }
  .entry-fallback a { color: rgba(242,236,217,0.7); }

  .section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--cream);
    background: var(--smoke);
    border-left: 3px solid var(--gold);
    display: inline-block;
    padding: 6px 18px;
    border-radius: 3px;
    margin: 44px 0 18px;
    transform: skewX(-6deg);
  }
  .section-label span { display: inline-block; transform: skewX(6deg); }

  .wall {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
  }
  .moment-card {
    background: rgba(242,236,217,0.05);
    border: 2px solid rgba(232,169,59,0.30);
    border-left: 4px solid var(--gold);
    border-radius: 8px;
    padding: 18px 20px;
    position: relative;
    box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
  }
  .moment-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 28px rgba(0,0,0,0.55);
    border-color: var(--spot);
  }
  .moment-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .moment-guide {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--gold-bright);
  }
  .moment-date {
    font-size: 12px;
    color: rgba(242,236,217,0.45);
    white-space: nowrap;
  }
  .moment-text {
    font-size: 14px;
    line-height: 1.55;
    color: rgba(242,236,217,0.92);
  }
  .moment-credit {
    margin-top: 10px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: rgba(232,169,59,0.75);
  }
  .wall-empty {
    text-align: center;
    padding: 30px 10px;
    color: rgba(242,236,217,0.5);
    font-size: 14px;
    grid-column: 1 / -1;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    flex-wrap: wrap;
    gap: 10px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: rgba(242,236,217,0.65);
  }
  .status-row button {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: rgba(242,236,217,0.1);
    color: var(--cream);
    border: 1px solid rgba(242,236,217,0.3);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  .status-row button:hover { background: rgba(242,236,217,0.18); }

  .error-box {
    margin-top: 18px;
    border: 2px solid #E14B4B;
    background: rgba(225,75,75,0.12);
    color: #FFD6D6;
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .error-box b { color: #fff; }

  footer {
    text-align: center;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid rgba(242,236,217,0.15);
  }
  .footer-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 15px;
    color: var(--gold-bright);
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(242,236,217,0.05);
    border: 1px solid rgba(242,236,217,0.18);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 16px;
    transition: border-color 140ms ease;
  }
  .search-bar:focus-within { border-color: var(--gold); }
  .search-bar input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--cream);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
  }
  .search-bar input::placeholder { color: rgba(242,236,217,0.45); }
  .wall-count {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(242,236,217,0.5);
    margin-bottom: 12px;
  }

  .recent-feed {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .recent-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(242,236,217,0.04);
    border-radius: 5px;
    padding: 9px 12px;
    font-size: 13px;
    border-left: 3px solid var(--gold);
    transition: border-color 140ms ease, background 140ms ease;
  }
  .recent-item:hover {
    border-left-color: var(--spot);
    background: rgba(242,236,217,0.07);
  }
  .recent-guide { font-weight: 700; color: var(--cream); white-space: nowrap; }
  .recent-snippet {
    flex: 1;
    min-width: 0;
    color: rgba(242,236,217,0.6);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .recent-credit {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: rgba(232,169,59,0.7);
    white-space: nowrap;
  }
  .recent-date { color: rgba(242,236,217,0.4); font-size: 12px; white-space: nowrap; }
  .recent-empty {
    text-align: center;
    padding: 20px 10px;
    color: rgba(242,236,217,0.5);
    font-size: 13px;
  }

  .lookup-result { min-height: 4px; }
  .lookup-empty {
    color: rgba(242,236,217,0.45);
    font-size: 13px;
    padding: 4px 2px 0;
  }
  .lookup-card {
    background: rgba(242,236,217,0.05);
    border: 1px solid rgba(242,236,217,0.15);
    border-left: 3px solid var(--spot);
    border-radius: 8px;
    padding: 18px 20px;
  }
  .lookup-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .lookup-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--cream);
  }
  .lookup-total {
    font-size: 13px;
    color: rgba(242,236,217,0.6);
  }
  .lookup-total b { color: var(--gold-bright); }
  .lookup-moments {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .lookup-moment {
    background: rgba(242,236,217,0.04);
    border-left: 3px solid var(--gold);
    border-radius: 5px;
    padding: 10px 14px;
  }
  .lookup-moment-date {
    font-size: 11px;
    color: rgba(242,236,217,0.45);
    margin-bottom: 4px;
  }
  .lookup-moment-text {
    font-size: 13.5px;
    line-height: 1.5;
    color: rgba(242,236,217,0.9);
  }
  .lookup-moment-credit {
    margin-top: 6px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11.5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: rgba(232,169,59,0.7);
  }

  .charts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 14px;
  }
  .chart-card {
    background: rgba(242,236,217,0.05);
    border: 1px solid rgba(242,236,217,0.15);
    border-radius: 8px;
    padding: 18px 20px;
  }
  .chart-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--cream);
    margin-bottom: 3px;
  }
  .chart-meta {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: rgba(242,236,217,0.45);
    margin-bottom: 14px;
  }
  .chart-rows { display: flex; flex-direction: column; gap: 9px; }
  .chart-row {
    display: grid;
    grid-template-columns: 22px minmax(70px, 130px) 1fr 28px;
    align-items: center;
    gap: 10px;
  }
  .chart-rank {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: rgba(242,236,217,0.4);
  }
  .chart-row:first-child .chart-rank { color: var(--spot); }
  .chart-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3px;
    color: rgba(242,236,217,0.85);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chart-track {
    display: block;
    height: 10px;
    background: rgba(242,236,217,0.08);
    border-radius: 5px;
    overflow: hidden;
  }
  .chart-fill {
    display: block;
    height: 100%;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-bright) 100%);
  }
  .chart-count {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--gold-bright);
    text-align: right;
  }
  .chart-empty {
    color: rgba(242,236,217,0.45);
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .moment-card, .btn, .recent-item, .search-bar { transition: none; }
    .live-dot { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="eyebrow-badge"><span class="live-dot"></span>Live Shoutouts</span>
    <h1 class="title">MAIN <span class="gold">STAGE</span></h1>
    <div class="tagline">Rockstar Moments — Spot the Set, Log the Moment</div>
    <div class="cta-row">
      <button class="btn btn-primary" id="openEntryBtn" type="button" aria-expanded="false" aria-controls="entryPanel">🎤 Log a Rockstar Moment</button>
      <a class="btn btn-ghost" href="https://ontour.admissions.purdue.edu/tgis/" target="_blank" rel="noopener">🔗 TGIS</a>
      <button class="btn btn-ghost" id="refreshBtnTop" type="button">↻ Refresh Now</button>
    </div>
  </div>

  <form class="entry-panel" id="entryPanel" hidden>
    <div class="entry-grid">
      <div class="entry-field">
        <label for="entryGuide">Who are you reporting on? <span class="req">*</span></label>
        <input id="entryGuide" list="guideNames" placeholder="Guide's name" maxlength="120" autocomplete="off" required>
      </div>
      <div class="entry-field">
        <label for="entryNominator">Who's reporting? <span class="opt">(optional)</span></label>
        <input id="entryNominator" placeholder="Your name" maxlength="120" autocomplete="off">
      </div>
    </div>
    <div class="entry-field">
      <label for="entryMoment">What was their Rockstar Moment? <span class="req">*</span></label>
      <textarea id="entryMoment" rows="4" placeholder="What did they do?" maxlength="1000" required></textarea>
    </div>
    <div class="entry-actions">
      <button class="btn btn-primary" id="entrySubmitBtn" type="submit">Post to the Setlist</button>
      <button class="btn btn-ghost" id="entryCancelBtn" type="button">Cancel</button>
      <span class="entry-status" id="entryStatus" role="status"></span>
    </div>
    <div class="entry-fallback">
      Trouble posting? <a id="formLink" href="#" target="_blank" rel="noopener">Use the Google Form instead</a>.
    </div>
  </form>

  <div class="section-label"><span>Just In</span></div>
  <div class="recent-feed" id="recentFeed"></div>

  <div class="section-label"><span>The Setlist</span></div>
  <div class="wall-count" id="resultCount"></div>
  <div class="wall" id="wall"></div>

  <div class="section-label"><span>Artist Lookup</span></div>
  <div class="search-bar">
    <input list="guideNames" id="guideLookupInput" placeholder="Type a guide's name to see all their Rockstar Moments…" autocomplete="off">
    <datalist id="guideNames"></datalist>
  </div>
  <div class="lookup-result" id="lookupResult"></div>

  <div class="section-label"><span>The Charts</span></div>
  <div class="charts">
    <div class="chart-card">
      <div class="chart-title">Shoutouts Received</div>
      <div class="chart-meta" id="chartReceivedMeta"></div>
      <div class="chart-rows" id="chartReceived"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Shoutouts Given</div>
      <div class="chart-meta" id="chartGivenMeta"></div>
      <div class="chart-rows" id="chartGiven"></div>
    </div>
  </div>

  <div class="status-row">
    <div id="lastUpdated">Loading…</div>
    <div id="status">Connecting to responses sheet…</div>
  </div>
  <div class="error-box" id="errorBox"></div>

  <footer>
    <div class="footer-tag">Train. Guide. Inspire. Own the Stage.</div>
  </footer>
</div>

<script>
  const SHEET_ID = "1IWwy3ygxsq81p9VRUW8MTv-tixjRWeb4BfcA-sT8YI8";
  // Numeric tab id, not the tab name — the gid survives a tab rename, a name does not.
  const SHEET_GID = "944135761";
  const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdJOB5KNIYejc93BGc_JOsLWL-E_j3Ze5QBt74Bqu_382mskw/viewform";
  // Same form, its submit endpoint. Posting here is what writes the row to the sheet,
  // so the on-page form and the Google Form feed the exact same responses tab.
  const FORM_ACTION = FORM_URL.replace(/\/viewform.*$/, "/formResponse");
  // Field ids from the live form. If a question is deleted and re-added in Google Forms
  // it gets a new id — reopen the form's HTML and re-read the entry.NNN values.
  const FIELD_GUIDE = "entry.1211982758";      // Who are you reporting on?
  const FIELD_MOMENT = "entry.113659133";      // What was their "Rockstar Moment?"
  const FIELD_NOMINATOR = "entry.733750023";   // Who's Reporting? (optional)
  const REFRESH_MS = 30000;

  document.getElementById("formLink").href = FORM_URL;

  const statusEl = document.getElementById("status");
  const lastUpdatedEl = document.getElementById("lastUpdated");
  const errorBoxEl = document.getElementById("errorBox");
  const wallEl = document.getElementById("wall");
  const resultCountEl = document.getElementById("resultCount");
  const recentFeedEl = document.getElementById("recentFeed");
  const guideLookupInputEl = document.getElementById("guideLookupInput");
  const guideNamesEl = document.getElementById("guideNames");
  const lookupResultEl = document.getElementById("lookupResult");
  const openEntryBtnEl = document.getElementById("openEntryBtn");
  const entryPanelEl = document.getElementById("entryPanel");
  const entryGuideEl = document.getElementById("entryGuide");
  const entryMomentEl = document.getElementById("entryMoment");
  const entryNominatorEl = document.getElementById("entryNominator");
  const entrySubmitBtnEl = document.getElementById("entrySubmitBtn");
  const entryCancelBtnEl = document.getElementById("entryCancelBtn");
  const entryStatusEl = document.getElementById("entryStatus");
  const chartReceivedEl = document.getElementById("chartReceived");
  const chartGivenEl = document.getElementById("chartGiven");
  const chartReceivedMetaEl = document.getElementById("chartReceivedMeta");
  const chartGivenMetaEl = document.getElementById("chartGivenMeta");

  let allMoments = [];

  function buildUrl() {
    const base = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`;
    const params = new URLSearchParams({
      tqx: "out:json;responseHandler:handleGvizResponse",
      gid: SHEET_GID,
      ts: Date.now()
    });
    return `${base}?${params.toString()}`;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function formatDate(raw) {
    if (!raw) return "";
    const d = new Date(raw);
    if (isNaN(d.getTime())) return String(raw);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  // Column D is optional — render nothing at all when no nominator was given.
  function credit(nominator, className) {
    if (!nominator) return "";
    return `<div class="${className}">spotted by ${escapeHtml(nominator)}</div>`;
  }

  function renderWall() {
    resultCountEl.textContent = `${allMoments.length} moment${allMoments.length === 1 ? "" : "s"}`;
    if (allMoments.length === 0) {
      wallEl.innerHTML = `<div class="wall-empty">No Rockstar Moments logged yet — be the first!</div>`;
      return;
    }
    wallEl.innerHTML = allMoments.map(m => `
      <div class="moment-card">
        <div class="moment-top">
          <span class="moment-guide">${escapeHtml(m.guide)}</span>
          <span class="moment-date">${escapeHtml(formatDate(m.timestamp))}</span>
        </div>
        <div class="moment-text">${escapeHtml(m.moment || "(no details given)")}</div>
        ${credit(m.nominator, "moment-credit")}
      </div>
    `).join("");
  }

  function renderRecentActivity() {
    const recent = allMoments.slice(0, 5);
    if (recent.length === 0) {
      recentFeedEl.innerHTML = `<div class="recent-empty">No Rockstar Moments logged yet — be the first!</div>`;
      return;
    }
    recentFeedEl.innerHTML = recent.map(m => `
      <div class="recent-item">
        <span class="recent-guide">${escapeHtml(m.guide)}</span>
        <span class="recent-snippet">${escapeHtml(m.moment || "")}</span>
        ${m.nominator ? `<span class="recent-credit">spotted by ${escapeHtml(m.nominator)}</span>` : ""}
        <span class="recent-date">${escapeHtml(formatDate(m.timestamp))}</span>
      </div>
    `).join("");
  }

  /* People type their own names, so one person arrives as "jordan", "Jordan" and
     "  JORDAN  ". Capitalization is a typing artifact rather than a signal, so a
     name-cased variant wins even if a shouted or lowercase one was typed more
     often. Nothing is invented — only spellings someone actually entered are
     shown, so a name always typed lowercase stays lowercase. */
  function bestSpelling(spellings) {
    const looksLikeAName = value => /^[A-Z]/.test(value) && /[a-z]/.test(value);
    return [...spellings.entries()].sort((a, b) =>
      (looksLikeAName(b[0]) ? 1 : 0) - (looksLikeAName(a[0]) ? 1 : 0) ||
      b[1] - a[1] ||
      a[0].localeCompare(b[0])
    )[0][0];
  }

  /* Counts one moment per row, keyed by whichever name `pick` returns. Rows with
     no name for that side are skipped, so moments logged without a reporter do
     not invent a blank entry in the "given" chart. */
  function tallyNames(pick) {
    const groups = new Map();
    allMoments.forEach(m => {
      const raw = (pick(m) || "").trim();
      if (!raw) return;
      const key = raw.toLowerCase();
      const group = groups.get(key) || { count: 0, spellings: new Map() };
      group.count++;
      group.spellings.set(raw, (group.spellings.get(raw) || 0) + 1);
      groups.set(key, group);
    });
    return [...groups.values()]
      .map(group => ({ name: bestSpelling(group.spellings), count: group.count }))
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  }

  function renderChart(targetEl, entries, emptyMessage) {
    if (entries.length === 0) {
      targetEl.innerHTML = `<div class="chart-empty">${emptyMessage}</div>`;
      return;
    }
    const max = entries[0].count;
    targetEl.innerHTML = entries.map((entry, index) => `
      <div class="chart-row">
        <span class="chart-rank">${index + 1}</span>
        <span class="chart-name" title="${escapeHtml(entry.name)}">${escapeHtml(entry.name)}</span>
        <span class="chart-track"><span class="chart-fill" style="width:${Math.max((entry.count / max) * 100, 8)}%"></span></span>
        <span class="chart-count">${entry.count}</span>
      </div>
    `).join("");
  }

  // Both charts list every name on the sheet, ranked — they are not top-N cuts.
  function renderCharts() {
    const received = tallyNames(m => m.guide);
    const given = tallyNames(m => m.nominator);
    renderChart(chartReceivedEl, received, "No shoutouts yet.");
    renderChart(chartGivenEl, given, "No one has left their name yet.");
    chartReceivedMetaEl.textContent = received.length
      ? `All ${received.length} guide${received.length === 1 ? "" : "s"}, most first`
      : "";
    chartGivenMetaEl.textContent = given.length
      ? `All ${given.length} reporter${given.length === 1 ? "" : "s"}, most first`
      : "";
  }

  function populateGuideNames() {
    const names = [...new Set(allMoments.map(m => m.guide))].sort((a, b) => a.localeCompare(b));
    guideNamesEl.innerHTML = names.map(n => `<option value="${escapeHtml(n)}"></option>`).join("");
  }

  function lookupGuide(rawQuery) {
    const query = rawQuery.trim().toLowerCase();
    if (!query) {
      lookupResultEl.innerHTML = `<div class="lookup-empty">Start typing a name to see all their logged Rockstar Moments.</div>`;
      return;
    }
    const matches = allMoments.filter(m => m.guide.toLowerCase() === query);
    if (matches.length === 0) {
      lookupResultEl.innerHTML = `<div class="lookup-empty">No Rockstar Moments found for "${escapeHtml(rawQuery)}" yet.</div>`;
      return;
    }
    lookupResultEl.innerHTML = `
      <div class="lookup-card">
        <div class="lookup-header">
          <div class="lookup-name">${escapeHtml(matches[0].guide)}</div>
          <div class="lookup-total"><b>${matches.length}</b> Rockstar Moment${matches.length === 1 ? "" : "s"}</div>
        </div>
        <div class="lookup-moments">
          ${matches.map(m => `
            <div class="lookup-moment">
              <div class="lookup-moment-date">${escapeHtml(formatDate(m.timestamp))}</div>
              <div class="lookup-moment-text">${escapeHtml(m.moment || "(no details given)")}</div>
              ${credit(m.nominator, "lookup-moment-credit")}
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  function parseRows(gvizData) {
    const rows = gvizData.table.rows || [];
    allMoments = [];

    rows.forEach(row => {
      const cells = row.c || [];
      const timestamp = cells[0] && cells[0].f ? cells[0].f : (cells[0] && cells[0].v ? cells[0].v : "");
      const guide = cells[1] && cells[1].v ? String(cells[1].v).trim() : null;
      const moment = cells[2] && cells[2].v ? String(cells[2].v).trim() : "";
      const nominator = cells[3] && cells[3].v ? String(cells[3].v).trim() : "";
      if (!guide) return;

      allMoments.push({ timestamp, guide, moment, nominator });
    });

    allMoments.reverse();
  }

  let pendingTimeout = null;

  window.handleGvizResponse = function(gvizData) {
    if (pendingTimeout) { clearTimeout(pendingTimeout); pendingTimeout = null; }
    try {
      parseRows(gvizData);
      renderRecentActivity();
      populateGuideNames();
      lookupGuide(guideLookupInputEl.value);
      renderWall();
      renderCharts();
      const now = new Date();
      lastUpdatedEl.textContent = `Updated ${now.toLocaleTimeString()}`;
      statusEl.textContent = `Auto-refreshing every ${REFRESH_MS / 1000}s`;
      errorBoxEl.style.display = "none";
    } catch (err) {
      showError(err.message);
    }
  };

  function showError(detail) {
    statusEl.textContent = "Could not load live data.";
    errorBoxEl.style.display = "block";
    errorBoxEl.innerHTML = `
      <b>Couldn't reach the responses sheet.</b><br>
      Double-check: Share → General access → "Anyone with the link" (Viewer),
      and that the responses tab is still gid ${SHEET_GID} in the sheet URL.
      <br><br>Technical detail: ${detail}
    `;
  }

  function loadData() {
    errorBoxEl.style.display = "none";
    statusEl.textContent = "Refreshing…";
    const old = document.getElementById("gviz-loader");
    if (old) old.remove();
    const script = document.createElement("script");
    script.id = "gviz-loader";
    script.src = buildUrl();
    script.onerror = () => showError("Network error loading the sheet script.");
    document.body.appendChild(script);
    pendingTimeout = setTimeout(() => {
      showError("No response from Google Sheets after 8 seconds.");
    }, 8000);
  }

  /* ---- posting a new moment ------------------------------------------------
     The browser cannot read a cross-origin Google Forms response, so the POST
     goes out in no-cors mode and comes back opaque — success is not knowable
     from the response itself. Instead we re-read the sheet a few times and look
     for the row we just wrote, which is a real confirmation rather than a
     hopeful one. */

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  /* Duplicate guard. Case and spacing are normalized so "Great  Tour" and
     "great tour" are one entry. The nominator is part of the key on purpose:
     one person cannot post the same moment twice, but two different people
     can independently say the same thing about the same guide. */
  function momentKey(guide, moment, nominator) {
    const norm = value => String(value || "").toLowerCase().replace(/\s+/g, " ").trim();
    return [norm(guide), norm(moment), norm(nominator)].join("|");
  }

  const submittedKeys = new Set();

  function sheetHasMoment(key) {
    return allMoments.some(m => momentKey(m.guide, m.moment, m.nominator) === key);
  }

  function setEntryStatus(message, kind) {
    entryStatusEl.textContent = message;
    entryStatusEl.className = `entry-status${kind ? " " + kind : ""}`;
  }

  function setPanelOpen(open) {
    entryPanelEl.hidden = !open;
    openEntryBtnEl.setAttribute("aria-expanded", String(open));
    if (open) entryGuideEl.focus();
  }

  entryPanelEl.addEventListener("submit", async event => {
    event.preventDefault();

    const guide = entryGuideEl.value.trim();
    const moment = entryMomentEl.value.trim();
    const nominator = entryNominatorEl.value.trim();
    if (!guide || !moment) {
      setEntryStatus("Add both a guide name and a moment.", "warn");
      return;
    }

    const key = momentKey(guide, moment, nominator);
    if (submittedKeys.has(key)) {
      setEntryStatus("You already posted that one.", "warn");
      return;
    }
    if (sheetHasMoment(key)) {
      setEntryStatus("That moment is already on the Setlist.", "warn");
      return;
    }
    submittedKeys.add(key);

    entrySubmitBtnEl.disabled = true;
    setEntryStatus("Sending…");

    const body = new URLSearchParams();
    body.append(FIELD_GUIDE, guide);
    body.append(FIELD_MOMENT, moment);
    if (nominator) body.append(FIELD_NOMINATOR, nominator);

    try {
      // URLSearchParams sends a form-encoded content type, which needs no preflight.
      await fetch(FORM_ACTION, { method: "POST", mode: "no-cors", body });
    } catch (err) {
      submittedKeys.delete(key);
      entrySubmitBtnEl.disabled = false;
      setEntryStatus("Couldn't reach Google Forms — check your connection.", "err");
      return;
    }

    setEntryStatus("Sent — confirming on the sheet…");
    for (let attempt = 0; attempt < 4; attempt++) {
      await wait(2000);
      loadData();
      await wait(1500);
      if (sheetHasMoment(key)) {
        entrySubmitBtnEl.disabled = false;
        entryGuideEl.value = "";
        entryMomentEl.value = "";
        setEntryStatus("Posted to the Setlist. 🎸", "ok");
        return;
      }
    }

    /* Never confirmed. Release the key so a genuine failure can be retried —
       if the row does land later, sheetHasMoment() blocks the retry instead. */
    submittedKeys.delete(key);
    entrySubmitBtnEl.disabled = false;
    setEntryStatus("Sent, but it hasn't appeared yet. Give it a moment and hit Refresh.", "warn");
  });

  openEntryBtnEl.addEventListener("click", () => {
    setPanelOpen(entryPanelEl.hidden);
    setEntryStatus("");
  });
  entryCancelBtnEl.addEventListener("click", () => {
    setPanelOpen(false);
    setEntryStatus("");
  });

  document.getElementById("refreshBtnTop").addEventListener("click", loadData);
  guideLookupInputEl.addEventListener("input", () => lookupGuide(guideLookupInputEl.value));
  lookupGuide("");
  loadData();
  setInterval(loadData, REFRESH_MS);
</script>
</body>
</html>
